<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UI Animation Concept | Ykey Design</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}html{scroll-behavior:smooth}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#fff;color:#111;overflow-x:hidden}
    nav{position:fixed;top:0;width:100%;padding:26px 5vw;display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.97);z-index:100}
    .logo{font-size:18px;font-weight:500}.back{text-decoration:none;color:#111;font-size:15px}
    .work-info{position:fixed;top:50%;left:5vw;transform:translateY(-50%);z-index:1;width:40vw}
    .work-info h1{font-size:clamp(28px,5vw,52px);font-weight:600;line-height:1.1;margin-bottom:16px}
    .work-info .desc{font-size:15px;color:#444;line-height:1.6;margin-bottom:40px}
    .work-info .team{font-size:14px;color:#888}
    .work-slider{position:relative;width:100vw;height:100vh;z-index:2}
    .slide-track{display:flex;gap:40px;height:100%;padding:0 5vw;align-items:center}
    .slide-track img{height:70vh;object-fit:cover;border-radius:2px}
  </style>
</head>
<body>

<nav>
  <div class="logo">Ykey Design</div>
  <a href="../index.html" class="back">← Back</a>
</nav>

<div class="work-info">
  <h1>UI Animation Concept</h1>
  <div class="desc">界面动态交互概念设计，包含微动效、转场动画、组件状态与用户体验优化，让界面更生动流畅。</div>
  <div class="team">Creative Direction: Ykey<br>Design & Motion: Ykey Studio</div>
</div>

<div class="work-slider" id="slider">
  <div class="slide-track">
    <img src="images/p2_1.jpg">
    <img src="images/p2_2.jpg">
    <img src="images/p2_3.gif">
    <img src="images/p2_4.jpg">
    <img src="images/p2_5.jpg">
  </div>
</div>

<script>const slider=document.getElementById('slider');window.addEventListener('wheel',e=>{slider.scrollLeft+=e.deltaY});</script>
</body>
</html>
