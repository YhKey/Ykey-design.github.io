<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal Brand Visual | Ykey Design</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}html{scroll-behavior:smooth}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#fff;color:#111;overflow-x:hidden}
    nav{position:fixed;top:0;width:100%;padding:26px 5vw;display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.97);z-index:100}
    .logo{font-size:18px;font-weight:500}.back{text-decoration:none;color:#111;font-size:15px}
    .work-info{position:fixed;top:50%;left:5vw;transform:translateY(-50%);z-index:1;width:40vw}
    .work-info h1{font-size:clamp(28px,5vw,52px);font-weight:600;line-height:1.1;margin-bottom:16px}
    .work-info .desc{font-size:15px;color:#444;line-height:1.6;margin-bottom:40px}
    .work-info .team{font-size:14px;color:#888}
    .work-slider{position:relative;width:100vw;height:100vh;z-index:2;overflow-x:auto;overflow-y:hidden;scroll-behavior:smooth}
    .slide-track{display:flex;gap:40px;height:100%;padding:0 5vw;align-items:center;transform:translateX(calc(100vw - 50%));transition:transform 0.3s ease}
    .slide-track img{height:70vh;object-fit:cover;border-radius:2px;min-width:50vw}
  </style>
</head>
<body>

<nav>
  <div class="logo">Ykey Design</div>
  <a href="../index.html" class="back">← Back</a>
</nav>

<div class="work-info">
  <h1>Minimal Brand Visual</h1>
  <div class="desc">极简品牌视觉设计，包含标志、色彩、字体系统与应用物料，整体风格克制、干净、现代。</div>
  <div class="team">Creative Direction: Ykey<br>Design: Ykey Studio</div>
</div>

<div class="work-slider" id="slider">
  <div class="slide-track">
    <img src="../images/p1_1.jpg">
    <img src="../images/p1_2.jpg">
    <img src="../images/p1_3.jpg">
    <img src="../images/p1_4.jpg">
    <img src="../images/p1_5.jpg">
  </div>
</div>

<script>
const slider = document.getElementById('slider');
const slideTrack = document.querySelector('.slide-track');

// 初始化滑块位置
function initSliderPosition() {
  // 计算初始位置，让第一张图片从右侧露出一半
  const windowWidth = window.innerWidth;
  const initialPosition = windowWidth - (windowWidth * 0.9);
  slider.scrollLeft = initialPosition;
}

// 初始化位置
initSliderPosition();

// 监听窗口大小变化，重新计算位置
window.addEventListener('resize', initSliderPosition);

// 监听滚轮事件
window.addEventListener('wheel', (e) => {
  // 阻止默认滚动行为
  e.preventDefault();
  
  // 根据滚轮方向调整滚动速度
  const scrollSpeed = 2000; // 滚动速度
  if (e.deltaY > 0) {
    // 向下滚动，图片从右往左
    slider.scrollLeft += scrollSpeed;
  } else {
    // 向上滚动，图片从左往右
    slider.scrollLeft -= scrollSpeed;
  }
}, { passive: false });
</script>
</body>
</html>
