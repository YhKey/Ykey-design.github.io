<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ykey Design</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}html{scroll-behavior:smooth}body{font-family:'Inter', -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#fff;color:#111;padding-bottom:100px}
    nav{position:fixed;top:0;width:100%;padding:20px 5vw;display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.97);z-index:99}
    img{user-select:none;-webkit-user-drag:none;pointer-events:none}
    .logo{font-size:16px;font-weight:500}.menu a{margin-left:20px;text-decoration:none;color:#111;font-size:14px;opacity:.7;transition:opacity .3s}.menu a:hover{opacity:1}
    .hero{height:100vh;display:flex;flex-direction:column;justify-content:center;padding:0 5vw}
    .hero h1{font-size:clamp(36px,8.5vw,100px);font-weight:500;line-height:1.04;margin-bottom:24px;opacity:0;animation:fadeIn 1.2s .2s forwards}
    .hero p{font-size:16px;color:#555;max-width:520px;opacity:0;animation:fadeIn 1.2s .5s forwards}
    @keyframes fadeIn{to{opacity:1}}
    .works{padding:20px 5vw;column-count:2;column-gap:32px}
    .work-item{display:block;text-decoration:none;color:inherit;break-inside:avoid;margin-bottom:44px}
    .work-img{position:relative;width:100%;overflow:hidden;margin-bottom:14px}
    .work-img img{width:100%;display:block;transition:opacity .6s}
    .img-default{opacity:1}
    .img-hover{position:absolute;top:0;left:0;opacity:0}
    .work-item:hover .img-default{opacity:0}
    .work-item:hover .img-hover{opacity:1}
    .work-title{font-size:20px;font-weight:500;margin-bottom:4px}
    .work-category{font-size:14px;color:#888}
    .about{padding:100px 5vw}
    .section-title{font-size:14px;color:#999;margin-bottom:28px}
    .about-text{max-width:620px;font-size:16px;line-height:1.7}
    .contact{padding:80px 5vw}
    .contact a{font-size:20px;color:#111;text-decoration:none;border-bottom:1px solid #111;padding-bottom:3px}
    
    /* 移动端适配 */
    @media (max-width: 768px) {
      nav{padding:16px 5vw}
      .menu a{margin-left:16px;font-size:13px}
      .works{column-count:1;column-gap:0}
      .work-item{margin-bottom:30px}
      .work-title{font-size:18px}
      .about{padding:80px 5vw}
      .contact{padding:60px 5vw}
      .contact a{font-size:18px}
    }
  </style>
</head>
<body>

<nav>
  <div class="logo"><a href="#works" style="text-decoration:none;">Ykey Design</a></div>
  <div class="menu">
    <!-- <a href="#works">Works</a> -->
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </div>
</nav>

<section class="hero">
  <h1>Digital Designer<br>Creative Direction</h1>
  <p>专注极简界面、品牌视觉与动态体验，用克制的设计传递力量。</p>
</section>

<section class="works" id="works">
  <a class="work-item" href="works/work1.html">
    <div class="work-img">
      <img src="images/cover1.jpg" class="img-default">
      <img src="images/cover1_hover.jpg" class="img-hover">
    </div>
    <div class="work-title">Minimal Brand Visual</div>
    <div class="work-category">Branding / Graphic</div>
  </a>

  <a class="work-item" href="works/work2.html">
    <div class="work-img">
      <img src="images/cover2.jpg" class="img-default">
      <img src="images/cover2_hover.gif" class="img-hover">
    </div>
    <div class="work-title">UI Animation Concept</div>
    <div class="work-category">UI / Motion</div>
  </a>

  <a class="work-item" href="works/work3.html">
    <div class="work-img">
      <img src="images/cover3.jpg" class="img-default">
      <img src="images/cover3_hover.jpg" class="img-hover">
    </div>
    <div class="work-title">Mobile App Interface</div>
    <div class="work-category">UX / UI Design</div>
  </a>

  <a class="work-item" href="works/work4.html">
    <div class="work-img">
      <img src="images/cover4.jpg" class="img-default">
      <img src="images/cover4_hover.gif" class="img-hover">
    </div>
    <div class="work-title">3D Visual Experience</div>
    <div class="work-category">3D / Interactive</div>
  </a>

  <a class="work-item" href="works/work5.html">
    <div class="work-img">
      <img src="images/cover5.jpg" class="img-default">
      <img src="images/cover5_hover.jpg" class="img-hover">
    </div>
    <div class="work-title">Website Layout Design</div>
    <div class="work-category">Web / Visual</div>
  </a>
</section>


<script>
// 禁用右键菜单
document.addEventListener('contextmenu', function(e) {
  e.preventDefault();
});

// 禁用Ctrl+S、Ctrl+U等快捷键
document.addEventListener('keydown', function(e) {
  // 禁用Ctrl+S
  if (e.ctrlKey && e.key === 's') {
    e.preventDefault();
  }
  // 禁用Ctrl+U
  if (e.ctrlKey && e.key === 'u') {
    e.preventDefault();
  }
  // 禁用F12
  if (e.key === 'F12') {
    e.preventDefault();
  }
});
</script>
</body>
</html>
